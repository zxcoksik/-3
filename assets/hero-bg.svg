<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="h1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="40%" stop-color="#0f0d14"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="h2" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c9a962" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#8b7355" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h3" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#4a3f6b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#h1)"/>
  <rect width="1920" height="1080" fill="url(#h2)"/>
  <rect width="1920" height="1080" fill="url(#h3)"/>
  <ellipse cx="1500" cy="350" rx="400" ry="300" fill="#c9a962" opacity="0.04" filter="url(#blur)"/>
  <ellipse cx="300" cy="850" rx="350" ry="250" fill="#6b5b95" opacity="0.06" filter="url(#blur)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e8e4dc" stroke-width="0.3" opacity="0.03"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Vinyl silhouette -->
  <circle cx="1600" cy="540" r="280" fill="none" stroke="#e8e4dc" stroke-width="0.5" opacity="0.06"/>
  <circle cx="1600" cy="540" r="200" fill="none" stroke="#e8e4dc" stroke-width="0.3" opacity="0.04"/>
  <circle cx="1600" cy="540" r="60" fill="#c9a962" opacity="0.08"/>
</svg>
